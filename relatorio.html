<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Relatório · Coleta</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/tema.js"></script>
</head>

<body>
    <div class="app wide">
        <header class="topbar" id="topbar"></header>

        <div class="page-head">
            <h1>Relatório</h1>
            <p>Todas as coletas registradas neste dispositivo.</p>
        </div>

        <section class="stats">
            <div class="stat"><span>Total</span><strong id="stTotal">0</strong></div>
            <div class="stat"><span>Cidades</span><strong id="stCidades">0</strong></div>
            <div class="stat"><span>Unidades</span><strong id="stUnidades">0</strong></div>
            <div class="stat"><span>Pendentes</span><strong id="stPendentes">0</strong></div>
        </section>

        <section class="filtros">
            <input type="search" id="fBusca" placeholder="Buscar por unidade, cidade ou coletor" />
            <select id="fCidade"><option value="">Todas as cidades</option></select>
            <input type="date" id="fDe" title="De" />
            <input type="date" id="fAte" title="Até" />
            <button type="button" class="btn" id="btnPdf">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
                PDF
            </button>
        </section>

        <section class="card tabela-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Unidade</th>
                        <th>Cidade</th>
                        <th>Localização</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="linhas"></tbody>
            </table>
            <div id="vazio" class="vazio" hidden>
                <strong>Nenhuma coleta encontrada</strong>
                Registre uma nova coleta ou ajuste os filtros.
            </div>
        </section>
    </div>

    <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="detTitulo">
        <div class="modal-card">
            <div class="modal-head">
                <div>
                    <h2 id="detTitulo"></h2>
                    <span id="detStatus" class="chip"></span>
                </div>
                <button type="button" class="btn-x no-print" data-fechar aria-label="Fechar">×</button>
            </div>
            <dl id="detCampos" class="det-campos"></dl>
            <h3>Parecer</h3>
            <p id="detParecer" class="det-parecer"></p>
            <h3 id="detFotosTitulo">Fotos</h3>
            <div id="detFotos" class="det-fotos"></div>
            <div class="modal-acoes no-print">
                <button type="button" class="btn" id="btnImprimir">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                    Imprimir
                </button>
                <button type="button" class="btn whats" id="btnWhats">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.200-.4-2.300-1.400-.9-.8-1.400-1.700-1.600-2-.2-.3 0-.4.1-.6l.4-.5c.1-.1.2-.3.3-.5.1-.2 0-.4 0-.5-.1-.1-.7-1.600-.9-2.200-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.500s1.100 2.900 1.200 3.100c.1.200 2.100 3.200 5.100 4.500.7.3 1.300.5 1.700.6.7.2 1.400.2 1.900.1.600-.1 1.700-.7 1.900-1.400.2-.7.2-1.200.2-1.400-.1-.1-.3-.2-.6-.3zM12 2a10 10 0 0 0-8.600 15.100L2 22l5-1.300A10 10 0 1 0 12 2zm0 18.200c-1.500 0-3-.4-4.200-1.200l-.3-.2-3 .8.8-2.900-.2-.3A8.200 8.200 0 1 1 12 20.200z"/></svg>
                    WhatsApp
                </button>
            </div>
        </div>
    </div>

    <div id="zoom" class="zoom" hidden><img id="zoomImg" alt="Foto ampliada" /></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/relatorio.js"></script>
</body>

</html>
