<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Entrar · Coleta</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/tema.js"></script>
</head>

<body>
    <script>document.write(Tema.botao("flutuante"));</script>
    <main class="login-wrap">
        <div class="login-box">
            <div class="brand">
                <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span>
                Coleta
            </div>
            <h1>Bem-vindo de volta</h1>
            <p class="sub">Entre para registrar e consultar coletas.</p>

            <form id="formLogin" class="card" novalidate>
                <div id="erro" class="erro-msg" hidden></div>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" autocomplete="username" placeholder="voce@empresa.com" required />
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="pw">
                        <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••" required />
                        <button type="button" id="verSenha">Mostrar</button>
                    </div>
                </div>
                <button type="submit" id="btnEntrar" class="btn primary block">Entrar</button>
            </form>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
