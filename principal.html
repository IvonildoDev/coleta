<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Nova coleta · Coleta</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="app">
        <header class="topbar" id="topbar"></header>

        <div class="page-head">
            <h1>Nova coleta</h1>
            <p>Olá, <span id="usuario"></span> <span id="conexao" class="chip offline" style="margin-left:6px">Offline</span></p>
        </div>

        <form id="formulario" class="card" novalidate>
            <div class="grid-2">
                <div class="campo">
                    <label for="unidade">Unidade</label>
                    <input type="text" id="unidade" required placeholder="Ex.: Unidade Centro" />
                </div>
                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" required placeholder="Ex.: Fortaleza" />
                </div>
            </div>

            <div class="campo">
                <label for="data">Data</label>
                <input type="date" id="data" required />
            </div>

            <div class="campo">
                <span class="rotulo">Localização</span>
                <div class="geo" id="geo">
                    <div class="geo-info">
                        <span id="geoTexto">Nenhuma localização capturada</span>
                        <small id="geoPrec"></small>
                    </div>
                    <button type="button" class="btn" id="btnLocalizacao">Capturar</button>
                </div>
            </div>

            <div class="campo">
                <label for="parecer">Parecer</label>
                <textarea id="parecer" required placeholder="Digite o parecer..."></textarea>
            </div>

            <div class="campo">
                <span class="rotulo">Fotos <span class="opc">(opcional)</span></span>
                <label class="dropzone" for="fotos">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                    Toque para tirar ou anexar fotos
                    <input type="file" id="fotos" accept="image/*" multiple />
                </label>
                <div id="preview" class="preview"></div>
            </div>

            <button type="submit" id="btnSalvar" class="btn primary block">Salvar coleta</button>
        </form>

        <div class="sync">
            <span>Pendentes de envio: <strong id="qtdPendentes">0</strong></span>
            <button type="button" class="btn sm" id="btnSincronizar">Sincronizar</button>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/principal.js"></script>
</body>

</html>
